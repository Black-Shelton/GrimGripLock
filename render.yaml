# Render Blueprint (New -> Blueprint) или просто настрой Web Service вручную по README.
services:
  - type: web
    name: lock-in-card-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
